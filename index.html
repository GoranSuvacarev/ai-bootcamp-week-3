<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#17152a" />
    <link rel="icon" href="data:," />
    <title>Quattro Kong</title>
    <style>
      :root {
        color: #f7f3e3;
        background: #0d0b19;
        font-family: system-ui, sans-serif;
      }

      * { box-sizing: border-box; }
      body { margin: 0; min-width: 320px; }
      .app-shell { width: min(1100px, 100%); margin: 0 auto; padding: 32px 24px 48px; }
      .eyebrow { color: #f4d35e; letter-spacing: 0.12em; text-transform: uppercase; font-size: 0.75rem; }
      h1 { margin: 0; font-size: clamp(2rem, 5vw, 4rem); }
      .objective { color: #b8b4d9; margin-top: 8px; }
      .game-layout { display: grid; grid-template-columns: minmax(0, 640px) 220px; gap: 24px; align-items: start; margin-top: 24px; }
      .canvas-frame { border: 3px solid #5b4b8a; background: #17152a; box-shadow: 8px 8px 0 #0a0912; }
      canvas { display: block; width: 100%; height: auto; }
      .hud { display: grid; gap: 12px; }
      .hud-card, .controls-card { border: 2px solid #5b4b8a; background: #17152a; padding: 16px; }
      .hud-card { display: flex; justify-content: space-between; align-items: baseline; }
      .hud-label { color: #b8b4d9; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.1em; }
      .hud-card strong { color: #f4d35e; font-size: 1.6rem; }
      .controls-card h2 { margin: 0 0 12px; font-size: 1rem; }
      .controls-card p { color: #b8b4d9; font-size: 0.82rem; margin: 10px 0; }
      kbd { color: #f7f3e3; border: 1px solid #b8b4d9; padding: 2px 5px; border-radius: 3px; }
      .phase-label { color: #6ee7b7; font-weight: 700; text-transform: uppercase; font-size: 0.8rem; }
      @media (max-width: 820px) { .game-layout { grid-template-columns: 1fr; } .hud { grid-template-columns: repeat(2, 1fr); } .controls-card, .phase-label { grid-column: 1 / -1; } }
    </style>
  </head>
  <body>
    <main class="app-shell">
      <section class="intro" aria-labelledby="game-title">
        <p class="eyebrow">Session 003 · Local arcade prototype</p>
        <h1 id="game-title">Quattro Kong</h1>
        <p class="objective">Climb the compact rooftop level and reach the goal.</p>
      </section>

      <section class="game-layout" aria-label="Game preview">
        <div class="canvas-frame">
          <canvas id="game-canvas" width="640" height="900" aria-label="Quattro Kong game area">
            Your browser does not support Canvas.
          </canvas>
        </div>

        <aside class="hud" aria-label="Game information">
          <div class="hud-card">
            <span class="hud-label">Score</span>
            <strong id="score-value">0000</strong>
          </div>
          <div class="hud-card">
            <span class="hud-label">Lives</span>
            <strong id="lives-value">03</strong>
          </div>
          <div class="controls-card">
            <h2>Controls</h2>
            <p><kbd>A</kbd> <kbd>D</kbd> or <kbd>←</kbd> <kbd>→</kbd> Move</p>
            <p><kbd>Space</kbd> Jump</p>
            <p><kbd>W</kbd> <kbd>S</kbd> or <kbd>↑</kbd> <kbd>↓</kbd> Climb</p>
          </div>
          <p id="phase-label" class="phase-label">Setup shell · Ready</p>
        </aside>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
